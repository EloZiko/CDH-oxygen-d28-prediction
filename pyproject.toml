[project]
name = "cdh-oxygen-d28-prediction"
version = "1.0.0"
description = "Prenatal prediction of oxygen dependency at day 28 in isolated left-sided CDH"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Same versions as in the article; uv.lock pins every other library.
dependencies = [
    "catboost==1.2.10",
    "numpy==2.5.4",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
]

[dependency-groups]
# Only needed to reproduce the analyses of the article (folder analysis/):
# `uv sync --group analysis`. xgboost and TabPFN: versions of the article.
analysis = [
    "imbalanced-learn==0.14.2",
    "matplotlib==3.11.2",
    "scipy==1.18.1",
    "seaborn==0.13.2",
    "shap==0.54.1",
    "statsmodels==0.15.0",
    "tabpfn==9.2.0",
    "xgboost==3.4.0",
]
# Only needed to run the tests; `uv sync` installs them too.
dev = [
    "mini-racer==0.14.1",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["model"]  # lets the tests import model/cdh_model.py
testpaths = ["tests"]

# The project is installed in its own environment, so that the scripts of
# analysis/ can import model/cdh_model.py.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["model/cdh_model.py"]
sources = ["model"]  # installed as cdh_model, without the folder name
